---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
spec:
  interval: 1h
  chart:
    spec:
      chart: snapshot-controller
      version: 5.4.1
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: flux-system
  values:
    # Keeps the snapshot CRDs, and with them every VolumeSnapshot, if the release is uninstalled.
    keepCRDs: true
