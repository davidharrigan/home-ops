---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-plex-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: grafana-plex-secret
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: token
